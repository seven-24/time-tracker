<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイムスケジューラー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; }

    /* モード切替 */
    .mode-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #cbd5e1;
      background-color: #f1f5f9;
      color: #475569;
      border-radius: 8px;
      cursor: pointer;
    }
    .mode-btn.active {
      background-color: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* 計算結果カード */
    .card {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .time-input {
      font-size: 16px;
      padding: 6px 10px;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      background: #fff;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-top: 1px dashed #bfdbfe;
      padding-top: 12px;
    }
    .result-time {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }

    /* 入力フォーム */
    .add-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px auto;
      grid-template-areas: "name duration add" "url url url";
      gap: 8px;
      margin-bottom: 20px;
    }
    .task-input, .url-input, .duration-input, .edit-input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    .task-input { grid-area: name; min-width: 0; }
    .url-input { grid-area: url; min-width: 0; }
    .duration-input {
      grid-area: duration;
      width: 76px;
      text-align: center;
    }
    .add-btn {
      grid-area: add;
      padding: 10px 16px;
      background-color: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    /* タイムラインリスト */
    .list-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      background: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .task-details { min-width: 0; flex: 1; }
    .task-name { font-weight: bold; font-size: 14px; margin-bottom: 2px; overflow-wrap: anywhere; }
    .task-time-range { font-size: 12px; color: #64748b; }
    .task-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      color: #2563eb;
      overflow-wrap: anywhere;
    }
    .task-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 2px;
    }
    .task-action {
      background: none;
      border: none;
      color: #475569;
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      min-width: 28px;
      min-height: 28px;
    }
    .task-action:hover { background: #f1f5f9; border-radius: 4px; }
    .delete-btn { color: #ef4444; }
    .drag-handle { cursor: grab; touch-action: none; }
    .dragging { opacity: 0.45; }
    .drop-before { border-top: 2px solid #2563eb; }
    .drop-after { border-bottom: 2px solid #2563eb; }
    .edit-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 76px;
      gap: 8px;
    }
    .edit-input { min-width: 0; width: 100%; }
    .edit-name { grid-column: 1; }
    .edit-duration { grid-column: 2; text-align: center; }
    .edit-url, .edit-actions { grid-column: 1 / -1; }
    .edit-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .edit-actions button {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>タイムスケジューラー</h1>
    <div class="subtitle">タスクを積み上げて所要時間・終了時刻を計算</div>
  </header>

  <!-- モード切替 -->
  <div class="mode-switch">
    <button id="btn-forward" class="mode-btn active" onclick="setMode('forward')">順算（何時に終わる？）</button>
    <button id="btn-reverse" class="mode-btn" onclick="setMode('reverse')">逆算（何時に始める？）</button>
  </div>

  <!-- 計算結果カード -->
  <div class="card">
    <div class="time-row">
      <label id="base-time-label" style="font-weight: bold; font-size: 14px; color: #1e3a8a;">開始時刻:</label>
      <input type="time" id="base-time" class="time-input" onchange="saveBaseTime(); render()">
    </div>
    <div class="summary-row">
      <div>
        <div style="font-size: 12px; color: #64748b;">合計所要時間</div>
        <div id="total-minutes" style="font-size: 16px; font-weight: bold;">0 分</div>
      </div>
      <div style="text-align: right;">
        <div id="result-label" style="font-size: 12px; color: #64748b;">完了予定時刻</div>
        <div id="result-time" class="result-time">00:00</div>
      </div>
    </div>
  </div>

  <!-- タスク追加フォーム -->
  <form class="add-form" onsubmit="handleAddTask(event)">
    <input type="text" id="new-task-name" class="task-input" placeholder="タスク名（例: 朝食）" aria-label="タスク名" required>
    <input type="number" id="new-task-duration" class="duration-input" min="1" value="10" placeholder="分" aria-label="所要時間（分）" required>
    <input type="url" id="new-task-url" class="url-input" placeholder="URL（任意）" aria-label="タスクのURL">
    <button type="submit" class="add-btn">追加</button>
  </form>

  <!-- タイムライン -->
  <div class="list-title">スケジュールタイムライン</div>
  <div id="task-list" class="task-list"></div>
</div>

<script>
  // データ管理
  let tasks = JSON.parse(localStorage.getItem('my_scheduler_tasks')) || [
    { id: '1', name: '朝食', duration: 15 },
    { id: '2', name: 'シャワー・身支度', duration: 25 },
    { id: '3', name: '持ち物チェック', duration: 5 }
  ];
  let currentMode = 'forward'; // 'forward' または 'reverse'
  let editingTaskId = null;
  let draggedTaskId = null;

  // 現在時刻をHH:mmで取得
  function getCurrentTime() {
    const now = new Date();
    return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  // 初期化
  const savedBaseTime = localStorage.getItem('my_scheduler_base_time');
  document.getElementById('base-time').value = savedBaseTime || getCurrentTime();

  function saveBaseTime() {
    localStorage.setItem('my_scheduler_base_time', document.getElementById('base-time').value);
  }

  function saveTasks() {
    localStorage.setItem('my_scheduler_tasks', JSON.stringify(tasks));
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-forward').classList.toggle('active', mode === 'forward');
    document.getElementById('btn-reverse').classList.toggle('active', mode === 'reverse');
    document.getElementById('base-time-label').textContent = mode === 'forward' ? '開始時刻:' : '目標終了時刻:';
    document.getElementById('result-label').textContent = mode === 'forward' ? '完了予定時刻' : '必要な開始時刻';
    render();
  }

  function handleAddTask(e) {
    e.preventDefault();
    const nameInput = document.getElementById('new-task-name');
    const durInput = document.getElementById('new-task-duration');
    const urlInput = document.getElementById('new-task-url');
    const name = nameInput.value.trim();
    const duration = parseInt(durInput.value, 10);
    if (!name || isNaN(duration) || duration <= 0) return;

    tasks.push({ id: Date.now().toString(), name, duration, url: urlInput.value.trim() });
    saveTasks();
    nameInput.value = '';
    urlInput.value = '';
    render();
  }

  function moveTask(id, offset) {
    const index = tasks.findIndex(task => task.id === id);
    const targetIndex = index + offset;
    if (index < 0 || targetIndex < 0 || targetIndex >= tasks.length) return;
    [tasks[index], tasks[targetIndex]] = [tasks[targetIndex], tasks[index]];
    saveTasks();
    render();
  }

  function reorderTask(sourceId, targetId, insertAfter) {
    if (!sourceId || sourceId === targetId) return;
    const sourceIndex = tasks.findIndex(task => task.id === sourceId);
    if (sourceIndex < 0) return;
    const [movedTask] = tasks.splice(sourceIndex, 1);
    let targetIndex = tasks.findIndex(task => task.id === targetId);
    if (targetIndex < 0) {
      tasks.splice(sourceIndex, 0, movedTask);
      return;
    }
    if (insertAfter) targetIndex++;
    tasks.splice(targetIndex, 0, movedTask);
    saveTasks();
    render();
  }

  function editTask(id) {
    editingTaskId = id;
    render();
  }

  function createEditForm(task) {
    const form = document.createElement('form');
    form.className = 'edit-form';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'edit-input edit-name';
    nameInput.value = task.name;
    nameInput.setAttribute('aria-label', 'タスク名');
    nameInput.required = true;

    const durationInput = document.createElement('input');
    durationInput.type = 'number';
    durationInput.className = 'edit-input edit-duration';
    durationInput.value = task.duration;
    durationInput.min = '1';
    durationInput.setAttribute('aria-label', '所要時間（分）');
    durationInput.required = true;

    const urlInput = document.createElement('input');
    urlInput.type = 'url';
    urlInput.className = 'edit-input edit-url';
    urlInput.value = task.url || '';
    urlInput.placeholder = 'URL（任意）';
    urlInput.setAttribute('aria-label', 'タスクのURL');

    const actions = document.createElement('div');
    actions.className = 'edit-actions';
    const saveButton = document.createElement('button');
    saveButton.type = 'submit';
    saveButton.textContent = '保存';
    const cancelButton = document.createElement('button');
    cancelButton.type = 'button';
    cancelButton.textContent = 'キャンセル';
    cancelButton.addEventListener('click', () => {
      editingTaskId = null;
      render();
    });
    actions.append(saveButton, cancelButton);
    form.append(nameInput, durationInput, urlInput, actions);
    form.addEventListener('submit', event => {
      event.preventDefault();
      const name = nameInput.value.trim();
      const duration = parseInt(durationInput.value, 10);
      if (!name || !Number.isInteger(duration) || duration <= 0 || !form.reportValidity()) return;
      task.name = name;
      task.duration = duration;
      task.url = urlInput.value.trim();
      editingTaskId = null;
      saveTasks();
      render();
    });
    return form;
  }

  function createActionButton(label, title, className, onClick) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'task-action ' + className;
    button.textContent = label;
    button.title = title;
    button.setAttribute('aria-label', title);
    button.addEventListener('click', onClick);
    return button;
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    render();
  }

  function parseToMinutes(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
  }

  function formatMinutes(min) {
    let m = min % 1440;
    if (m < 0) m += 1440;
    const h = Math.floor(m / 60);
    const mRem = m % 60;
    return String(h).padStart(2, '0') + ':' + String(mRem).padStart(2, '0');
  }

  function render() {
    const baseTimeStr = document.getElementById('base-time').value || '00:00';
    const baseMin = parseToMinutes(baseTimeStr);
    const totalMin = tasks.reduce((sum, t) => sum + t.duration, 0);

    document.getElementById('total-minutes').textContent = totalMin + ' 分';

    const startMin = currentMode === 'forward' ? baseMin : baseMin - totalMin;
    const endMin = currentMode === 'forward' ? baseMin + totalMin : baseMin;

    document.getElementById('result-time').textContent = formatMinutes(currentMode === 'forward' ? endMin : startMin);

    // リスト描画
    const listEl = document.getElementById('task-list');
    listEl.innerHTML = '';

    if (tasks.length === 0) {
      listEl.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 13px; padding: 16px;">タスクがありません</p>';
      return;
    }

    let pointer = startMin;
    tasks.forEach(task => {
      const taskStart = pointer;
      const taskEnd = taskStart + task.duration;
      pointer = taskEnd;

      const item = document.createElement('div');
      item.className = 'task-item';
      item.dataset.taskId = task.id;

      const details = document.createElement('div');
      details.className = 'task-details';
      if (editingTaskId === task.id) {
        details.appendChild(createEditForm(task));
      } else {
        const name = document.createElement('div');
        name.className = 'task-name';
        name.textContent = task.name;
        const timeRange = document.createElement('div');
        timeRange.className = 'task-time-range';
        timeRange.textContent = `${formatMinutes(taskStart)} 〜 ${formatMinutes(taskEnd)} (${task.duration}分)`;
        details.append(name, timeRange);
        if (task.url) {
          try {
            const url = new URL(task.url);
            if (url.protocol === 'http:' || url.protocol === 'https:') {
              const link = document.createElement('a');
              link.className = 'task-link';
              link.href = url.href;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = task.url;
              details.appendChild(link);
            }
          } catch (error) {}
        }
      }

      const actions = document.createElement('div');
      actions.className = 'task-actions';
      if (editingTaskId !== task.id) {
        const dragHandle = createActionButton('⋮⋮', 'ドラッグして並べ替え', 'drag-handle', () => {});
        dragHandle.draggable = true;
        dragHandle.addEventListener('dragstart', event => {
          draggedTaskId = task.id;
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', task.id);
          item.classList.add('dragging');
        });
        dragHandle.addEventListener('dragend', () => {
          draggedTaskId = null;
          document.querySelectorAll('.task-item').forEach(row => row.classList.remove('dragging', 'drop-before', 'drop-after'));
        });
        item.addEventListener('dragover', event => {
          event.preventDefault();
          if (!draggedTaskId || draggedTaskId === task.id) return;
          const insertAfter = event.clientY > item.getBoundingClientRect().top + item.offsetHeight / 2;
          item.classList.toggle('drop-before', !insertAfter);
          item.classList.toggle('drop-after', insertAfter);
        });
        item.addEventListener('drop', event => {
          event.preventDefault();
          const insertAfter = event.clientY > item.getBoundingClientRect().top + item.offsetHeight / 2;
          reorderTask(event.dataTransfer.getData('text/plain') || draggedTaskId, task.id, insertAfter);
          draggedTaskId = null;
        });
        actions.append(
          dragHandle,
          createActionButton('↑', '上へ', 'move-up-btn', () => moveTask(task.id, -1)),
          createActionButton('↓', '下へ', 'move-down-btn', () => moveTask(task.id, 1)),
          createActionButton('✎', '編集', 'edit-btn', () => editTask(task.id)),
          createActionButton('×', '削除', 'delete-btn', () => deleteTask(task.id))
        );
      }
      item.append(details, actions);
      listEl.appendChild(item);
    });
  }

  // 初回描画
  render();
</script>

</body>
</html>
