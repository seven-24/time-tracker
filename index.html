<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイムスケジューラー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #64748b; }

    /* モード切替 */
    .mode-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #cbd5e1;
      background-color: #f1f5f9;
      color: #475569;
      border-radius: 8px;
      cursor: pointer;
    }
    .mode-btn.active {
      background-color: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* 計算結果カード */
    .card {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .time-input {
      font-size: 16px;
      padding: 6px 10px;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      background: #fff;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-top: 1px dashed #bfdbfe;
      padding-top: 12px;
    }
    .result-time {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }

    /* 入力フォーム */
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .task-input {
      flex: 3;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    .duration-input {
      width: 70px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
    .add-btn {
      padding: 10px 16px;
      background-color: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    /* タイムラインリスト */
    .list-title {
      font-size: 14px;
      color: #475569;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .task-name { font-weight: bold; font-size: 14px; margin-bottom: 2px; }
    .task-time-range { font-size: 12px; color: #64748b; }
    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>タイムスケジューラー</h1>
    <div class="subtitle">タスクを積み上げて所要時間・終了時刻を計算</div>
  </header>

  <!-- モード切替 -->
  <div class="mode-switch">
    <button id="btn-forward" class="mode-btn active" onclick="setMode('forward')">順算（何時に終わる？）</button>
    <button id="btn-reverse" class="mode-btn" onclick="setMode('reverse')">逆算（何時に始める？）</button>
  </div>

  <!-- 計算結果カード -->
  <div class="card">
    <div class="time-row">
      <label id="base-time-label" style="font-weight: bold; font-size: 14px; color: #1e3a8a;">開始時刻:</label>
      <input type="time" id="base-time" class="time-input" onchange="saveBaseTime(); render()">
    </div>
    <div class="summary-row">
      <div>
        <div style="font-size: 12px; color: #64748b;">合計所要時間</div>
        <div id="total-minutes" style="font-size: 16px; font-weight: bold;">0 分</div>
      </div>
      <div style="text-align: right;">
        <div id="result-label" style="font-size: 12px; color: #64748b;">完了予定時刻</div>
        <div id="result-time" class="result-time">00:00</div>
      </div>
    </div>
  </div>

  <!-- タスク追加フォーム -->
  <form class="add-form" onsubmit="handleAddTask(event)">
    <input type="text" id="new-task-name" class="task-input" placeholder="タスク名（例: 朝食）" required>
    <input type="number" id="new-task-duration" class="duration-input" min="1" value="10" placeholder="分" required>
    <button type="submit" class="add-btn">追加</button>
  </form>

  <!-- タイムライン -->
  <div class="list-title">スケジュールタイムライン</div>
  <div id="task-list" class="task-list"></div>
</div>

<script>
  // データ管理
  let tasks = JSON.parse(localStorage.getItem('my_scheduler_tasks')) || [
    { id: '1', name: '朝食', duration: 15 },
    { id: '2', name: 'シャワー・身支度', duration: 25 },
    { id: '3', name: '持ち物チェック', duration: 5 }
  ];
  let currentMode = 'forward'; // 'forward' または 'reverse'

  // 現在時刻をHH:mmで取得
  function getCurrentTime() {
    const now = new Date();
    return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }

  // 初期化
  const savedBaseTime = localStorage.getItem('my_scheduler_base_time');
  document.getElementById('base-time').value = savedBaseTime || getCurrentTime();

  function saveBaseTime() {
    localStorage.setItem('my_scheduler_base_time', document.getElementById('base-time').value);
  }

  function saveTasks() {
    localStorage.setItem('my_scheduler_tasks', JSON.stringify(tasks));
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-forward').classList.toggle('active', mode === 'forward');
    document.getElementById('btn-reverse').classList.toggle('active', mode === 'reverse');
    document.getElementById('base-time-label').textContent = mode === 'forward' ? '開始時刻:' : '目標終了時刻:';
    document.getElementById('result-label').textContent = mode === 'forward' ? '完了予定時刻' : '必要な開始時刻';
    render();
  }

  function handleAddTask(e) {
    e.preventDefault();
    const nameInput = document.getElementById('new-task-name');
    const durInput = document.getElementById('new-task-duration');
    const name = nameInput.value.trim();
    const duration = parseInt(durInput.value, 10);
    if (!name || isNaN(duration) || duration <= 0) return;

    tasks.push({ id: Date.now().toString(), name, duration });
    saveTasks();
    nameInput.value = '';
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    render();
  }

  function parseToMinutes(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
  }

  function formatMinutes(min) {
    let m = min % 1440;
    if (m < 0) m += 1440;
    const h = Math.floor(m / 60);
    const mRem = m % 60;
    return String(h).padStart(2, '0') + ':' + String(mRem).padStart(2, '0');
  }

  function render() {
    const baseTimeStr = document.getElementById('base-time').value || '00:00';
    const baseMin = parseToMinutes(baseTimeStr);
    const totalMin = tasks.reduce((sum, t) => sum + t.duration, 0);

    document.getElementById('total-minutes').textContent = totalMin + ' 分';

    const startMin = currentMode === 'forward' ? baseMin : baseMin - totalMin;
    const endMin = currentMode === 'forward' ? baseMin + totalMin : baseMin;

    document.getElementById('result-time').textContent = formatMinutes(currentMode === 'forward' ? endMin : startMin);

    // リスト描画
    const listEl = document.getElementById('task-list');
    listEl.innerHTML = '';

    if (tasks.length === 0) {
      listEl.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 13px; padding: 16px;">タスクがありません</p>';
      return;
    }

    let pointer = startMin;
    tasks.forEach(task => {
      const taskStart = pointer;
      const taskEnd = taskStart + task.duration;
      pointer = taskEnd;

      const item = document.createElement('div');
      item.className = 'task-item';
      item.innerHTML = `
        <div>
          <div class="task-name">${task.name}</div>
          <div class="task-time-range">${formatMinutes(taskStart)} 〜 ${formatMinutes(taskEnd)} (${task.duration}分)</div>
        </div>
        <button class="delete-btn" onclick="deleteTask('${task.id}')" title="削除">×</button>
      `;
      listEl.appendChild(item);
    });
  }

  // 初回描画
  render();
</script>

</body>
</html>
